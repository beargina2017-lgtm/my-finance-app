<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>個人財務助理</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen pb-12">

  <header class="bg-indigo-600 text-white p-4 shadow-md sticky top-0 z-10 flex justify-between items-center">
    <h1 class="text-xl font-bold flex items-center gap-2">
      <span>💰</span> 個人財務助理
    </h1>
    <span class="text-xs bg-indigo-700 px-2.5 py-1 rounded-full">PWA 測試版</span>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-6">

    <div class="flex bg-white rounded-xl shadow-sm p-1 border border-gray-100 text-sm font-medium">
      <button onclick="switchTab('record')" id="tab-record" class="flex-1 py-2 rounded-lg text-center bg-indigo-600 text-white font-semibold transition">記帳</button>
      <button onclick="switchTab('list')" id="tab-list" class="flex-1 py-2 rounded-lg text-center text-gray-500 hover:text-gray-700 transition">明細</button>
      <button onclick="switchTab('category')" id="tab-category" class="flex-1 py-2 rounded-lg text-center text-gray-500 hover:text-gray-700 transition">分類設定</button>
      <button onclick="switchTab('analysis')" id="tab-analysis" class="flex-1 py-2 rounded-lg text-center text-gray-500 hover:text-gray-700 transition">財務分析</button>
    </div>

    <section id="page-record" class="space-y-4">
      <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100 space-y-4">
        <div class="flex gap-2 border-b pb-3">
          <button onclick="setMode('manual')" id="mode-manual" class="flex-1 py-1.5 text-sm rounded-lg font-semibold bg-indigo-100 text-indigo-700">✍️ 手動輸入</button>
          <button onclick="setMode('photo')" id="mode-photo" class="flex-1 py-1.5 text-sm rounded-lg font-semibold bg-gray-100 text-gray-600">📷 拍照/上傳發票</button>
        </div>

        <div id="photo-area" class="hidden border-2 border-dashed border-indigo-200 rounded-xl p-6 text-center bg-indigo-50/50">
          <input type="file" id="invoice-photo" accept="image/*" capture="environment" class="hidden" onchange="handlePhotoUpload(event)">
          <label for="invoice-photo" class="cursor-pointer space-y-2 block">
            <div class="text-3xl">📸</div>
            <div class="text-sm font-medium text-indigo-600">點擊拍照或上傳發票照片</div>
            <div class="text-xs text-gray-400">自動辨識發票金額與品項</div>
          </label>
          <div id="photo-preview" class="mt-3 text-xs text-gray-500 hidden"></div>
        </div>

        <form id="record-form" onsubmit="addRecord(event)" class="space-y-3">
          <div>
            <label class="block text-xs font-semibold text-gray-500 mb-1">日期</label>
            <input type="date" id="input-date" required class="w-full border border-gray-200 rounded-xl p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
          </div>

          <div>
            <label class="block text-xs font-semibold text-gray-500 mb-1">品項描述</label>
            <input type="text" id="input-desc" placeholder="例如：午餐便當、水費、全家咖啡" required class="w-full border border-gray-200 rounded-xl p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
          </div>

          <div>
            <label class="block text-xs font-semibold text-gray-500 mb-1">消費分類</label>
            <select id="input-category" required class="w-full border border-gray-200 rounded-xl p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </select>
          </div>

          <div>
            <label class="block text-xs font-semibold text-gray-500 mb-1">金額 (NT$)</label>
            <input type="number" id="input-amount" placeholder="0" min="1" required class="w-full border border-gray-200 rounded-xl p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
          </div>

          <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-xl shadow-sm transition mt-2">
            儲存紀錄
          </button>
        </form>
      </div>
    </section>

    <section id="page-list" class="hidden space-y-4">
      <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100">
        <div class="flex justify-between items-center mb-4">
          <h2 class="font-bold text-gray-700">記帳明細列表</h2>
          <button onclick="clearAllRecords()" class="text-xs text-red-500 hover:underline">清除全部</button>
        </div>

        <div class="overflow-x-auto">
          <table class="w-full text-left text-xs text-gray-600 border-collapse">
            <thead>
              <tr class="border-b bg-gray-50 text-gray-400">
                <th class="p-2">日期</th>
                <th class="p-2">品項描述</th>
                <th class="p-2">類別</th>
                <th class="p-2 text-right">金額</th>
              </tr>
            </thead>
            <tbody id="record-list-body">
            </tbody>
          </table>
        </div>
        <div id="empty-msg" class="text-center py-8 text-gray-400 text-xs">尚無記帳紀錄</div>
      </div>
    </section>

    <section id="page-category" class="hidden space-y-4">
      <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100 space-y-4">
        <h2 class="font-bold text-gray-700 text-sm">自訂分類管理</h2>
        
        <form onsubmit="addCustomCategory(event)" class="space-y-3 bg-gray-50 p-3 rounded-xl">
          <div class="text-xs font-semibold text-gray-600">新增分類選項（如：水費、電費）</div>
          <div class="flex gap-2">
            <select id="new-cat-type" class="border border-gray-200 rounded-lg p-2 text-xs">
              <option value="固定支出">固定支出</option>
              <option value="變動支出">變動支出</option>
              <option value="收入">收入</option>
            </select>
            <input type="text" id="new-cat-name" placeholder="分類名稱" required class="flex-1 border border-gray-200 rounded-lg p-2 text-xs">
            <button type="submit" class="bg-indigo-600 text-white text-xs px-3 py-2 rounded-lg font-medium">新增</button>
          </div>
        </form>

        <div class="space-y-3 text-xs">
          <div>
            <span class="font-bold text-indigo-600">【收入】</span>
            <div id="cat-list-income" class="flex flex-wrap gap-1.5 mt-1"></div>
          </div>
          <div>
            <span class="font-bold text-indigo-600">【固定支出】</span>
            <div id="cat-list-fixed" class="flex flex-wrap gap-1.5 mt-1"></div>
          </div>
          <div>
            <span class="font-bold text-indigo-600">【變動支出】</span>
            <div id="cat-list-variable" class="flex flex-wrap gap-1.5 mt-1"></div>
          </div>
        </div>
      </div>
    </section>

    <section id="page-analysis" class="hidden space-y-4">
      <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100 space-y-4">
        <h2 class="font-bold text-gray-700 text-sm">本月財務分析</h2>
        
        <button onclick="generateAnalysis()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-xl text-xs transition">
          📊 進行自動財務分析
        </button>

        <div id="analysis-result" class="bg-emerald-50/50 border border-emerald-100 rounded-xl p-4 text-xs text-gray-700 space-y-3 hidden">
          <div class="font-bold text-emerald-800 border-b border-emerald-200 pb-1">本月消費摘要報告</div>
          <div>
            <div class="font-semibold text-emerald-700">1. 支出占比最高前兩大類別：</div>
            <p id="analysis-top-two" class="mt-0.5 text-gray-600"></p>
          </div>
          <div>
            <div class="font-semibold text-emerald-700">2. 需要特別注意的消費：</div>
            <p id="analysis-warnings" class="mt-0.5 text-gray-600"></p>
          </div>
          <div>
            <div class="font-semibold text-emerald-700">3. 下個月可追蹤改善方向：</div>
            <p id="analysis-actions" class="mt-0.5 text-gray-600"></p>
          </div>
        </div>
      </div>
    </section>

  </main>

  <script>
    const defaultCategories = {
      "收入": ["薪資", "獎金", "其他"],
      "固定支出": ["房租", "保險", "電信", "訂閱", "水費", "電費"],
      "變動支出": ["外食", "超商", "生活用品", "娛樂", "醫療"]
    };

    let categories = JSON.parse(localStorage.getItem('my_categories')) || defaultCategories;
    let records = JSON.parse(localStorage.getItem('my_records')) || [];

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('input-date').valueAsDate = new Date();
      renderCategories();
      renderRecords();
    });

    function switchTab(tabName) {
      ['record', 'list', 'category', 'analysis'].forEach(t => {
        document.getElementById(`page-${t}`).classList.add('hidden');
        document.getElementById(`tab-${t}`).className = "flex-1 py-2 rounded-lg text-center text-gray-500 hover:text-gray-700 transition";
      });
      document.getElementById(`page-${tabName}`).classList.remove('hidden');
      document.getElementById(`tab-${tabName}`).className = "flex-1 py-2 rounded-lg text-center bg-indigo-600 text-white font-semibold transition";
    }

    function setMode(mode) {
      if (mode === 'photo') {
        document.getElementById('photo-area').classList.remove('hidden');
        document.getElementById('mode-photo').className = "flex-1 py-1.5 text-sm rounded-lg font-semibold bg-indigo-100 text-indigo-700";
        document.getElementById('mode-manual').className = "flex-1 py-1.5 text-sm rounded-lg font-semibold bg-gray-100 text-gray-600";
      } else {
        document.getElementById('photo-area').classList.add('hidden');
        document.getElementById('mode-manual').className = "flex-1 py-1.5 text-sm rounded-lg font-semibold bg-indigo-100 text-indigo-700";
        document.getElementById('mode-photo').className = "flex-1 py-1.5 text-sm rounded-lg font-semibold bg-gray-100 text-gray-600";
      }
    }

    function handlePhotoUpload(event) {
      const file = event.target.files[0];
      if (file) {
        document.getElementById('photo-preview').innerText = `已載入發票圖片：${file.name}（自動帶入範例資料中）`;
        document.getElementById('photo-preview').classList.remove('hidden');
        
        setTimeout(() => {
          document.getElementById('input-desc').value = "全家便利商店 (發票)";
          document.getElementById('input-amount').value = 125;
          document.getElementById('input-category').value = "超商";
        }, 500);
      }
    }

    function renderCategories() {
      const select = document.getElementById('input-category');
      select.innerHTML = '';

      for (let group in categories) {
        let optgroup = document.createElement('optgroup');
        optgroup.label = group;
        categories[group].forEach(cat => {
          let opt = document.createElement('option');
          opt.value = cat;
          opt.innerText = `${group} - ${cat}`;
          optgroup.appendChild(opt);
        });
        select.appendChild(optgroup);
      }

      ['income', 'fixed', 'variable'].forEach((key, idx) => {
        const groupName = ["收入", "固定支出", "變動支出"][idx];
        const container = document.getElementById(`cat-list-${key}`);
        container.innerHTML = categories[groupName].map(c => 
          `<span class="bg-gray-100 text-gray-700 px-2.5 py-1 rounded-full border border-gray-200">${c}</span>`
        ).join('');
      });

      localStorage.setItem('my_categories', JSON.stringify(categories));
    }

    function addCustomCategory(e) {
      e.preventDefault();
      const type = document.getElementById('new-cat-type').value;
      const name = document.getElementById('new-cat-name').value.trim();
      
      if (name && !categories[type].includes(name)) {
        categories[type].push(name);
        renderCategories();
        document.getElementById('new-cat-name').value = '';
        alert(`已成功新增類別「${name}」！`);
      }
    }

    function addRecord(e) {
      e.preventDefault();
      const record = {
        date: document.getElementById('input-date').value,
        desc: document.getElementById('input-desc').value.trim(),
        category: document.getElementById('input-category').value,
        amount: Number(document.getElementById('input-amount').value)
      };

      records.unshift(record);
      localStorage.setItem('my_records', JSON.stringify(records));
      renderRecords();

      document.getElementById('input-desc').value = '';
      document.getElementById('input-amount').value = '';
      alert('已新增紀錄！');
    }

    function renderRecords() {
      const tbody = document.getElementById('record-list-body');
      const emptyMsg = document.getElementById('empty-msg');
      tbody.innerHTML = '';

      if (records.length === 0) {
        emptyMsg.classList.remove('hidden');
        return;
      }
      emptyMsg.classList.add('hidden');

      records.forEach(r => {
        let tr = document.createElement('tr');
        tr.className = "border-b hover:bg-gray-50";
        tr.innerHTML = `
          <td class="p-2 font-mono text-gray-500">${r.date}</td>
          <td class="p-2 font-medium text-gray-800">${r.desc}</td>
          <td class="p-2 text-indigo-600 font-medium">${r.category}</td>
          <td class="p-2 text-right font-bold text-gray-900">$${r.amount}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    function clearAllRecords() {
      if (confirm('確定要清除所有紀錄嗎？')) {
        records = [];
        localStorage.removeItem('my_records');
        renderRecords();
      }
    }

    function generateAnalysis() {
      const resultDiv = document.getElementById('analysis-result');
      if (records.length === 0) {
        alert('請先新增記帳紀錄再進行分析！');
        return;
      }

      let totals = {};
      records.forEach(r => {
        totals[r.category] = (totals[r.category] || 0) + r.amount;
      });

      let sorted = Object.entries(totals).sort((a, b) => b - a);
      let topTwo = sorted.slice(0, 2).map(item => `「${item[0]}」（$${item}）`).join(' 與 ');

      document.getElementById('analysis-top-two').innerText = topTwo || "暫無足夠資料";
      document.getElementById('analysis-warnings').innerText = `目前共記錄 ${records.length} 筆項目。請多留意非必要的變動支出。`;
      document.getElementById('analysis-actions').innerText = "建議下個月為前兩大支出類別設定消費上限，並追蹤固定水電與訂閱費。";

      resultDiv.classList.remove('hidden');
    }
  </script>
</body>
</html>
