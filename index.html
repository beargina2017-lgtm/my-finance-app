<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>記帳史萊姆 🟡</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#f472b6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    @keyframes bounce-slow {
      0%, 100% { transform: translateY(0) scale(1, 1); }
      50% { transform: translateY(-8px) scale(1.05, 0.95); }
    }
    .animate-slime {
      animation: bounce-slow 2.5s infinite ease-in-out;
    }
    .bg-pink-pattern {
      background-color: #fff1f2;
      background-image: radial-gradient(#fbcfe8 1px, transparent 1px);
      background-size: 16px 16px;
    }
  </style>
</head>
<body class="bg-pink-pattern text-gray-800 font-sans min-h-screen pb-16">

  <!-- LINE 內建瀏覽器引導提示 -->
  <div id="line-notice" class="hidden bg-amber-500 text-white text-xs p-2 text-center flex justify-between items-center px-4 sticky top-0 z-50 shadow">
    <span>⚠️ 目前使用 LINE 瀏覽器，拍照功能受限。建議點選右上角 [ ⋯ ] 選擇<b>「以預設瀏覽器開啟」</b>(Safari / Chrome)！</span>
    <button onclick="document.getElementById('line-notice').remove()" class="ml-2 font-bold bg-amber-600 px-2 py-0.5 rounded">✕</button>
  </div>

  <!-- Header -->
  <header class="bg-pink-500 text-white p-4 shadow-md sticky top-0 z-10 flex justify-between items-center border-b-2 border-pink-600">
    <div class="flex items-center gap-2">
      <span class="text-2xl animate-slime">🟡</span>
      <div>
        <h1 class="text-lg font-extrabold tracking-wide">記帳史萊姆</h1>
        <p class="text-[10px] text-pink-100">招財可愛 · 隨手輕鬆記</p>
      </div>
    </div>
    <button onclick="exportData()" class="text-xs bg-pink-600 hover:bg-pink-700 px-2.5 py-1.5 rounded-lg border border-pink-400 font-medium transition">
      📥 匯出備份
    </button>
  </header>

  <!-- 招財史萊姆互動封面 Banner -->
  <section class="max-w-md mx-auto p-4 pb-0">
    <div class="bg-white rounded-3xl p-4 shadow-sm border border-pink-200 flex items-center gap-4 relative overflow-hidden">
      <!-- 史萊姆圖案 -->
      <div class="relative flex-shrink-0 cursor-pointer" onclick="slimeTalk('hello')">
        <div class="w-16 h-16 bg-amber-400 rounded-full flex items-center justify-center shadow-inner animate-slime relative border-2 border-amber-500">
          <div class="flex gap-2 items-center">
            <div class="w-2.5 h-2.5 bg-gray-800 rounded-full"></div>
            <div class="w-1.5 h-1.5 bg-pink-400 rounded-full -mt-2"></div>
            <div class="w-2.5 h-2.5 bg-gray-800 rounded-full"></div>
          </div>
          <div class="absolute bottom-3 w-3 h-1.5 bg-red-400 rounded-b-full"></div>
          <div class="absolute -top-1 right-1 text-xs">✨</div>
        </div>
        <span class="block text-[10px] text-center font-bold text-amber-600 mt-1">黃金招財</span>
      </div>

      <!-- 對話框 -->
      <div class="flex-1 bg-pink-50 border-2 border-pink-200 rounded-2xl p-3 text-xs text-pink-800 relative shadow-inner">
        <div class="absolute -left-2 top-5 w-0 h-0 border-t-8 border-t-transparent border-r-8 border-r-pink-200 border-b-8 border-b-transparent"></div>
        <p id="slime-speech" class="font-semibold leading-relaxed">
          「嗨～我是招財史萊姆！你今天記帳了嗎？捏捏～」
        </p>
        <div id="slime-actions" class="mt-2 flex gap-2 hidden">
          <button onclick="switchTab('record')" class="bg-pink-500 text-white px-2.5 py-1 rounded-full text-[11px] font-bold hover:bg-pink-600">✍️ 繼續記帳</button>
          <button onclick="switchTab('analysis')" class="bg-amber-500 text-white px-2.5 py-1 rounded-full text-[11px] font-bold hover:bg-amber-600">🌱 查看消費植物</button>
        </div>
      </div>
    </div>
  </section>

  <!-- 信用卡最晚繳費提醒 Banner -->
  <section id="card-alert-container" class="max-w-md mx-auto p-4 pb-0 hidden">
    <div class="bg-amber-50 border border-amber-200 rounded-2xl p-3 flex items-center justify-between text-xs text-amber-900 shadow-sm">
      <div class="flex items-center gap-2">
        <span class="text-xl">💳</span>
        <div>
          <span class="font-bold" id="card-alert-title">信用卡繳費提醒</span>
          <p id="card-alert-detail" class="text-[11px] text-amber-700"></p>
        </div>
      </div>
      <button onclick="switchTab('card')" class="bg-amber-500 text-white px-2 py-1 rounded-lg text-[10px] font-bold">查看</button>
    </div>
  </section>

  <!-- Main Container -->
  <main class="max-w-md mx-auto p-4 space-y-4">

    <!-- Navigation Tabs -->
    <div class="flex bg-white rounded-2xl shadow-sm p-1 border border-pink-200 text-xs font-bold text-gray-500">
      <button onclick="switchTab('record')" id="tab-record" class="flex-1 py-2.5 rounded-xl text-center bg-pink-500 text-white transition">記帳</button>
      <button onclick="switchTab('list')" id="tab-list" class="flex-1 py-2.5 rounded-lg text-center transition">明細</button>
      <button onclick="switchTab('category')" id="tab-category" class="flex-1 py-2.5 rounded-lg text-center transition">分類設定</button>
      <button onclick="switchTab('card')" id="tab-card" class="flex-1 py-2.5 rounded-lg text-center transition">刷卡提醒</button>
      <button onclick="switchTab('analysis')" id="tab-analysis" class="flex-1 py-2.5 rounded-lg text-center transition">分析/植物</button>
    </div>

    <!-- 1. 記帳頁面 -->
    <section id="page-record" class="space-y-4">
      <div class="bg-white rounded-3xl p-5 shadow-sm border border-pink-200 space-y-4">
        
        <!-- 切換模式 -->
        <div class="flex gap-2 border-b border-pink-100 pb-3">
          <button onclick="setMode('manual')" id="mode-manual" class="flex-1 py-2 text-xs rounded-xl font-bold bg-pink-100 text-pink-700">✍️ 手動輸入</button>
          <button onclick="setMode('photo')" id="mode-photo" class="flex-1 py-2 text-xs rounded-xl font-bold bg-gray-100 text-gray-600">📷 拍照/上傳發票</button>
        </div>

        <!-- 照片上傳區 -->
        <div id="photo-area" class="hidden border-2 border-dashed border-pink-300 rounded-2xl p-5 text-center bg-pink-50/50 space-y-2">
          <input type="file" id="invoice-photo" accept="image/*" capture="environment" class="hidden" onchange="handlePhotoUpload(event)">
          <label for="invoice-photo" class="cursor-pointer block space-y-1">
            <div class="text-3xl">📸</div>
            <div class="text-xs font-bold text-pink-600">點擊拍攝發票或選擇照片</div>
            <div class="text-[10px] text-gray-400">自動識別發票金額與品項</div>
          </label>
          <div id="photo-preview" class="text-[11px] text-pink-600 font-medium hidden"></div>
        </div>

        <!-- 記帳表單 -->
        <form id="record-form" onsubmit="addRecord(event)" class="space-y-3 text-xs">
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block font-bold text-gray-600 mb-1">日期</label>
              <input type="date" id="input-date" required class="w-full border border-pink-200 rounded-xl p-2.5 focus:ring-2 focus:ring-pink-400 outline-none">
            </div>
            <div>
              <label class="block font-bold text-gray-600 mb-1">付款方式</label>
              <select id="input-payment" class="w-full border border-pink-200 rounded
